name: Release

# Triggered when a `v*` tag is pushed (typically by `just release X.Y.Z`).
on:
  push:
    tags: ['v*']

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub release
      id-token: write   # mint the OIDC token for RubyGems Trusted Publishing
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Verify gemspec version matches tag
        run: |
          GEM_VERSION=$(ruby -Ilib -rjsonb_operations/version -e 'puts JsonbOperations::VERSION')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$GEM_VERSION" != "$TAG_VERSION" ]; then
            echo "version mismatch: tag=$TAG_VERSION, gem=$GEM_VERSION" >&2
            exit 1
          fi

      - name: Push to RubyGems
        uses: rubygems/release-gem@v1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: 'jsonb_operations-*.gem'
          generate_release_notes: true
